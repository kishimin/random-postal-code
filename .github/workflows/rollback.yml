name: Rollback (Production)

# Manual only, one half at a time: the Worker and the Pages site roll back
# independently (design.md section 10). docs/deployment.md explains how to
# find the version or deployment ID to restore.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which half to roll back
        type: choice
        options:
          - backend
          - frontend
      version:
        description: >-
          Worker version ID (backend; empty restores the previous version) or
          Pages deployment ID (frontend; required)
        type: string
        required: false
        default: ""

permissions:
  contents: read

# Shared with the deploy workflow, so a deploy and a rollback never race.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  backend:
    name: Roll back Worker
    if: github.ref == 'refs/heads/main' && inputs.target == 'backend'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up frontend toolchain
        uses: ./.github/actions/setup-frontend

      # --message skips wrangler's interactive confirmation. The version is
      # checked to be a version ID first, so a dispatch input cannot smuggle
      # extra wrangler flags in. With no version, wrangler restores the one
      # uploaded before the current one.
      - name: Roll back Worker
        working-directory: apps/web/backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ inputs.version }}
        run: |
          message="Rolled back by GitHub Actions run $GITHUB_RUN_ID"
          if [ -z "$VERSION_ID" ]; then
            bunx wrangler rollback --message "$message"
          elif [[ "$VERSION_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            bunx wrangler rollback "$VERSION_ID" --message "$message"
          else
            echo "::error::version must be a Worker version ID (a UUID) or empty."
            exit 1
          fi

  frontend:
    name: Roll back Pages
    if: github.ref == 'refs/heads/main' && inputs.target == 'frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      # wrangler has no Pages rollback command, so this calls Cloudflare's
      # API directly. Only an earlier successful production deployment can
      # be restored this way.
      - name: Roll back Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.ZIPNAMI_PAGES_PROJECT }}
          DEPLOYMENT_ID: ${{ inputs.version }}
        run: |
          # The ID becomes part of an authenticated API path, so anything but
          # a deployment ID (a UUID) is refused rather than allowed to change
          # which endpoint receives the POST.
          if ! [[ "$DEPLOYMENT_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "::error::A Pages rollback needs the ID (a UUID) of the deployment to restore (see docs/deployment.md)."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --output /dev/null \
            --write-out "Pages rollback: HTTP %{http_code}\n" \
            --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT/deployments/$DEPLOYMENT_ID/rollback"
