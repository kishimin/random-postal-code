name: CI (Pull Request)

on:
  pull_request:
    # labeled/unlabeled re-run the checks when atdd-unlock-approved is added
    # or removed, so the acceptance lock below reflects the current label.
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

# Read-only by default: no job here needs to write to the repository, and CI
# must not hand deployment, Maps, or advertising credentials to a build step.
permissions:
  contents: read

concurrency:
  group: ci-pull-request-${{ github.ref }}
  cancel-in-progress: true

env:
  # A placeholder origin keeps the production build representative without
  # exposing a real endpoint. Nothing in CI calls it.
  VITE_API_BASE_URL: http://127.0.0.1:8787

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The acceptance check below needs the merge base, which a shallow
          # clone does not contain.
          fetch-depth: 0

      - name: Set up frontend toolchain
        uses: ./.github/actions/setup-frontend

      - name: Test cross-package and deployment config contracts
        run: bun run test:config

      # An acceptance test is fixed before the implementation is written, so a
      # pull request may add one and must not edit one, unless a human
      # approved the edit on its Issue and the pull request is labeled
      # atdd-unlock-approved (see the script for what that still refuses).
      - name: Check that no acceptance test was modified
        env:
          ATDD_UNLOCK_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'atdd-unlock-approved') }}
        run: bash .github/scripts/check-acceptance-lock.sh "$(git merge-base origin/${{ github.base_ref }} HEAD)"

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Lint markup
        run: bun run lint:markup

      - name: Type check
        run: bun run typecheck

      - name: Test custom ESLint rules
        run: bun run test:eslint

      - name: Check postal data for drift
        run: bun run check:postal-data

      - name: Build production bundle
        run: bun run build

  package-tests:
    name: Test (${{ matrix.size }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - size: Small
            script: test:small
          - size: Medium
            script: test:medium
          - size: Storybook
            script: test:storybook

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up frontend toolchain
        uses: ./.github/actions/setup-frontend
        with:
          playwright-browsers: chromium

      - name: Vitest ${{ matrix.size }} tests
        run: bun run ${{ matrix.script }}

      - name: Upload test results and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.size }}-test-results
          path: |
            apps/*/*/test-result.json
            apps/*/*/coverage
            packages/*/test-result.json
            packages/*/coverage
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    # Running Issue #18's CI quality gates acceptance test below re-runs
    # test:coverage:pr, build, and check:postal-data inside itself (it judges
    # the real gates, not a mock of them), roughly doubling this job's own
    # work on top of checkout and setup.
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up frontend toolchain
        uses: ./.github/actions/setup-frontend
        with:
          playwright-browsers: chromium

      # Every metric in the overall summary must reach 80% (ADR-0048). The
      # threshold is applied by the script through COVERAGE_THRESHOLD.
      - name: Vitest coverage (Small and Medium)
        run: bun run test:coverage:pr

      # Issue #18's Medium acceptance test is registered here, in an
      # existing required check, rather than in a new job: the main
      # ruleset's required checks are fixed, and a job nobody requires would
      # not block a merge on failure (ADR-0031, ADR-0042). This job needs no
      # browser, matching the test's own Medium classification.
      - name: Run Issue #18 CI quality gates acceptance test (Medium)
        run: bun test ./acceptance/ci-quality-gates.medium.test.ts

      # Issue #25's acceptance test exercises a repository document, not a
      # workspace package, so no package's vitest.config.ts has a claim on
      # it (ADR-0069). ADR-0077 binds such a non-package test to its runner
      # by naming its path in a CI step directly, the same way Issue #18's
      # own acceptance test above is bound.
      - name: Run Issue #25 Figma UI source acceptance test (Medium)
        run: bun test ./acceptance/figma-ui-source-and-screen-map.medium.test.ts

      # Issue #19's acceptance test reads the deployment workflows and runs
      # each workspace's deploy-settings verifier, so like the two above it
      # belongs to no single package's vitest.config.ts (ADR-0077). It needs
      # no Cloudflare credentials.
      - name: Run Issue #19 Web deployment acceptance test (Medium)
        run: bun test ./acceptance/web-deployment.medium.test.ts

      # Issue #38's acceptance test runs the frontend production build and
      # reads the _headers file Pages serves from it, so it belongs to no
      # single package's vitest.config.ts either (ADR-0077).
      - name: Run Issue #38 Content-Security-Policy acceptance test (Medium)
        run: bun test ./acceptance/web-content-security-policy.medium.test.ts

      # Issue #39's acceptance test also reads the production build and the
      # deployment runbook, so it is bound here the same way (ADR-0077).
      - name: Run Issue #39 consent management acceptance test (Medium)
        run: bun test ./acceptance/web-consent-management.medium.test.ts

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            apps/*/*/coverage
            packages/*/coverage
          if-no-files-found: error
          retention-days: 14

  report:
    name: Test Report
    needs: package-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download test results
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: "*-test-results"
          path: results

      - name: Summarize test results
        uses: actions/github-script@v7
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const { summarizeDownloadedRuns } = await import(
              pathToFileURL(
                `${process.env.GITHUB_WORKSPACE}/.github/scripts/summarize-vitest-run.mjs`,
              ).href
            );

            await summarizeDownloadedRuns({
              core,
              sizes: ["Small", "Medium", "Storybook"],
            });

  frontend-e2e-medium:
    name: Frontend E2E (Medium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web/frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up frontend toolchain
        uses: ./.github/actions/setup-frontend
        with:
          playwright-browsers: chromium webkit

      - name: Build frontend
        run: bun run build

      - name: Run Medium browser tests
        run: bun run e2e:medium

      - name: Upload browser test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-e2e-medium-results
          path: |
            apps/web/frontend/playwright-report
            apps/web/frontend/test-results
          if-no-files-found: ignore
          retention-days: 14
