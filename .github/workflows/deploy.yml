name: Deploy (Production)

# Runs after every merge once CI (Push) passes, and by hand (Issue #108).
# Neither trigger runs pull-request code, so the Cloudflare credentials stay
# away from it (Issue #18's "CI does not expose deployment secrets"):
# workflow_run always runs this file as it is on main, and CI (Push) itself
# runs only for pushes to main.
#
# Every production value comes from the `production` GitHub Environment
# rather than this file: design.md section 12 fixes the Pages origin, Worker
# URL, and project name "from the provisioned Cloudflare resources", and
# docs/deployment.md lists what to set there.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which half to deploy
        type: choice
        options:
          - both
          - backend
          - frontend
        default: both
  workflow_run:
    workflows:
      - CI (Push)
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

# Shared with the rollback workflow, so a deploy and a rollback never race.
# A group holds only one waiting run and cancels the older one, so a run that
# will deploy nothing (it follows a failed or cancelled CI run) takes a group
# of its own; otherwise it could cancel a waiting deploy.
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' ||
    github.event.workflow_run.conclusion == 'success') && 'deploy-production' ||
    format('deploy-nothing-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan deploy
    # workflow_run also fires for a failed or cancelled CI run; only a passed
    # push to main may deploy. A dispatch picks its halves from inputs.target,
    # so the job runs for it with every step skipped.
    if: >-
      github.event_name == 'workflow_dispatch' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    outputs:
      frontend: ${{ steps.plan.outputs.frontend }}
      backend: ${{ steps.plan.outputs.backend }}

    steps:
      - name: Check out repository
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # The diff reaches back to the commit each half last deployed.
          fetch-depth: 0

      # Compares with the deploy records the Worker and Pages jobs leave, so
      # each half is planned against what it actually has live.
      - name: Pick the halves that changed
        id: plan
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node .github/scripts/plan-deploy.mjs plan

  backend:
    name: Deploy Worker
    needs: plan
    # Only main deploys: a dispatch from another branch would otherwise ship
    # unreviewed code to production. An automatic run has no inputs, so the
    # plan decides.
    if: >-
      github.ref == 'refs/heads/main' && (
      inputs.target == 'both' || inputs.target == 'backend' ||
      needs.plan.outputs.backend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      deployments: write

    steps:
      # On workflow_run, github.sha is main's newest commit, which CI may not
      # have verified yet; deploy the one it did.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up frontend toolchain
        uses: ./.github/actions/setup-frontend

      - name: Verify Worker deploy settings
        env:
          ALLOWED_ORIGINS: ${{ vars.ZIPNAMI_PAGES_ORIGIN }}
        run: bun run --filter @zipnami/web-backend verify:deploy-env

      # The allowlist is passed with --var rather than committed to
      # wrangler.jsonc: it is the production Pages origin, which only exists
      # once the project is provisioned. It is a public origin, not a secret;
      # do not pass secrets with --var, use `wrangler secret` instead.
      # Unquoted is safe: the step above has already proven the value is one
      # https origin, so it holds no space or glob character.
      - name: Record the Worker deploy as started
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node .github/scripts/plan-deploy.mjs record-start backend

      - name: Deploy Worker
        working-directory: apps/web/backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_ORIGIN: ${{ vars.ZIPNAMI_PAGES_ORIGIN }}
        run: bunx wrangler deploy --var ALLOWED_ORIGINS:$PAGES_ORIGIN

      # always(): a failed or cancelled deploy must be recorded as such, or the
      # next plan would trust it as live.
      - name: Record the Worker deploy's outcome
        if: ${{ always() && steps.record.outputs.id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.record.outputs.id }}
          OUTCOME: ${{ job.status }}
        run: node .github/scripts/plan-deploy.mjs record-finish

  frontend:
    name: Deploy Pages
    # Deliberately not `needs: backend`: each half deploys on its own
    # (design.md section 10). With target "both" they run side by side.
    needs: plan
    if: >-
      github.ref == 'refs/heads/main' && (
      inputs.target == 'both' || inputs.target == 'frontend' ||
      needs.plan.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up frontend toolchain
        uses: ./.github/actions/setup-frontend

      - name: Verify Pages deploy settings
        env:
          VITE_API_BASE_URL: ${{ vars.ZIPNAMI_WORKER_URL }}
          VITE_GOOGLE_ADSENSE_CLIENT_ID: ${{ vars.ZIPNAMI_ADSENSE_CLIENT_ID }}
          VITE_GOOGLE_ADSENSE_SLOT_ID: ${{ vars.ZIPNAMI_ADSENSE_SLOT_ID }}
          VITE_ADSENSE_TEST_MODE: "false"
          VITE_GOOGLE_MAPS_API_KEY: ${{ vars.ZIPNAMI_WEB_MAPS_API_KEY }}
          VITE_GOOGLE_ANALYTICS_MEASUREMENT_ID: ${{ vars.ZIPNAMI_WEB_GA_MEASUREMENT_ID }}
        run: bun run --filter @zipnami/web-frontend verify:deploy-env

      # Vite bakes these into the bundle at build time, so the Worker URL
      # the site calls is fixed here, not at request time.
      - name: Build Pages assets
        env:
          VITE_API_BASE_URL: ${{ vars.ZIPNAMI_WORKER_URL }}
          VITE_GOOGLE_ADSENSE_CLIENT_ID: ${{ vars.ZIPNAMI_ADSENSE_CLIENT_ID }}
          VITE_GOOGLE_ADSENSE_SLOT_ID: ${{ vars.ZIPNAMI_ADSENSE_SLOT_ID }}
          VITE_ADSENSE_TEST_MODE: "false"
          VITE_GOOGLE_MAPS_API_KEY: ${{ vars.ZIPNAMI_WEB_MAPS_API_KEY }}
          VITE_GOOGLE_ANALYTICS_MEASUREMENT_ID: ${{ vars.ZIPNAMI_WEB_GA_MEASUREMENT_ID }}
        run: bun run --filter @zipnami/web-frontend build

      # --branch main makes this a production deployment, provided the
      # project's production branch is main (docs/deployment.md creates it
      # that way).
      - name: Record the Pages deploy as started
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node .github/scripts/plan-deploy.mjs record-start frontend

      - name: Deploy Pages
        working-directory: apps/web/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.ZIPNAMI_PAGES_PROJECT }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: bunx wrangler pages deploy dist --project-name "$PAGES_PROJECT" --branch main --commit-hash "$DEPLOYED_SHA"

      - name: Record the Pages deploy's outcome
        if: ${{ always() && steps.record.outputs.id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.record.outputs.id }}
          OUTCOME: ${{ job.status }}
        run: node .github/scripts/plan-deploy.mjs record-finish

  production-tests:
    name: Production tests
    needs:
      - backend
      - frontend
    # Runs after whichever halves this run deployed. A skipped half is fine
    # (it was not chosen or did not change); a failed one means there is
    # nothing sound to check. With neither deployed, production is unchanged.
    if: >-
      ${{ github.ref == 'refs/heads/main' && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      (needs.backend.result == 'success' || needs.frontend.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up frontend toolchain
        uses: ./.github/actions/setup-frontend
        with:
          playwright-browsers: chromium

      # The happy path on the deployed site, from Pages through the Worker.
      # The tests abort the advertising, consent, and Analytics hosts in the
      # browser, so a deploy neither requests a real ad nor records a visit
      # (Issue #104).
      - name: Run the production tests from Pages through Workers
        env:
          PRODUCTION_BASE_URL: ${{ vars.ZIPNAMI_PAGES_ORIGIN }}
        run: bun run --filter @zipnami/web-frontend e2e:production

  report-failure:
    name: Report failure
    needs:
      - plan
      - backend
      - frontend
      - production-tests
    # Reports only. Rolling back stays a person's call: rollback has not yet
    # run in production, and the first production failure was a test defect
    # (#96), so an automatic rollback could undo a sound release (Issue #108).
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Post the failed run to Discord
        env:
          WEBHOOK_URL: ${{ secrets.ZIPNAMI_DISCORD_WEBHOOK_URL }}
          MESSAGE: |
            **Zipnami production deploy failed**
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Commit: ${{ github.event.workflow_run.head_sha || github.sha }}
            Nothing was rolled back. Check the run first; if production is broken, roll back by hand (docs/deployment.md "Rolling back"):
            - Worker, to the previous version: `gh workflow run rollback.yml -f target=backend`
            - Pages: `gh workflow run rollback.yml -f target=frontend -f version=<deployment-id>` (IDs from `bunx wrangler pages deployment list --project-name <project> --environment production`)
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::The Discord webhook secret is not set; see docs/deployment.md, One-time setup step 7."
            exit 1
          fi
          jq -n --arg content "$MESSAGE" '{content: $content}' |
            curl --fail --silent --show-error --max-time 30 \
              --header 'Content-Type: application/json' \
              --data-binary @- "$WEBHOOK_URL"
