name: CI (Nightly)

on:
  schedule:
    - cron: "0 18 * * *" # 03:00 JST
  workflow_dispatch:

# Read-only by default: no job here needs to write to the repository, and CI
# must not hand deployment, Maps, or advertising credentials to a build step.
permissions:
  contents: read

concurrency:
  group: ci-nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  # A placeholder origin keeps the production build representative without
  # exposing a real endpoint. Nothing in CI calls it.
  VITE_API_BASE_URL: http://127.0.0.1:8787

jobs:
  package-tests:
    name: Test (${{ matrix.size }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - size: Small
            script: test:small
          - size: Medium
            script: test:medium
          - size: Large
            script: test:large
          - size: Storybook
            script: test:storybook

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up frontend toolchain
        uses: ./.github/actions/setup-frontend
        with:
          playwright-browsers: chromium

      - name: Vitest ${{ matrix.size }} tests
        run: bun run ${{ matrix.script }}

      - name: Upload test results and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.size }}-test-results
          path: |
            apps/*/*/test-result.json
            apps/*/*/coverage
            packages/*/test-result.json
            packages/*/coverage
          if-no-files-found: error
          retention-days: 14

  report:
    name: Test Report
    needs: package-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download test results
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: "*-test-results"
          path: results

      - name: Summarize test results
        uses: actions/github-script@v7
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const { summarizeDownloadedRuns } = await import(
              pathToFileURL(
                `${process.env.GITHUB_WORKSPACE}/.github/scripts/summarize-vitest-run.mjs`,
              ).href
            );

            await summarizeDownloadedRuns({
              core,
              sizes: ["Small", "Medium", "Large", "Storybook"],
            });

  # Issue #18, "a failing required check blocks merge": whether the ruleset
  # actually enforces this needs GitHub's API, which needs the network
  # (ADR-0004, ADR-0044), so this Large acceptance test cannot share a
  # pull-request-triggered workflow (ADR-0031/ADR-0042's secret and
  # permission rules apply only there; nightly is schedule/workflow_dispatch,
  # so it is outside them). GITHUB_TOKEN avoids GitHub's anonymous rate
  # limit; it is the default token, not a repository secret.
  acceptance-large:
    name: Acceptance Tests (Large)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up frontend toolchain
        uses: ./.github/actions/setup-frontend

      - name: Run Issue #18 CI quality gates acceptance test (Large)
        run: bun test ./acceptance/ci-quality-gates.large.test.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-e2e-large:
    name: Frontend E2E (Large)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/web/frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up frontend toolchain
        uses: ./.github/actions/setup-frontend
        with:
          playwright-browsers: chromium webkit

      - name: Build frontend
        run: bun run build

      # Acceptance tests live at the repository root, but playwright.config.ts
      # names each one explicitly in testMatch rather than discovering them by
      # directory glob. A Large acceptance test must be added there by name
      # (alongside the two existing Medium ones) for nightly CI to run it here.
      - name: Run Large browser tests
        run: bun run e2e:large

      - name: Upload browser test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-e2e-large-results
          path: |
            apps/web/frontend/playwright-report
            apps/web/frontend/test-results
          if-no-files-found: ignore
          retention-days: 14
