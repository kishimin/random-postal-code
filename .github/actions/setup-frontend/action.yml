name: Set up the Zipnami frontend toolchain
description: >-
  Installs Bun, restores workspace dependencies from the committed lockfile, and
  optionally installs Playwright browsers. Shared by every CI workflow so the
  three event schedules cannot drift apart in how they build the environment.

inputs:
  playwright-browsers:
    description: >-
      Space-separated Playwright browsers to install, for example "chromium" or
      "chromium webkit". Leave empty to skip the browser download entirely.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.13

    # Bun's download cache is cached instead of the installed trees. Listing
    # node_modules directories meant naming every workspace, and a workspace
    # added without a matching line here still restored a cache hit: install was
    # then skipped and its binaries were simply absent, so its scripts failed
    # with exit 127 on the second run and passed on the first. Caching upstream
    # of the install keeps one entry correct for any number of workspaces.
    - name: Cache Bun downloads
      uses: actions/cache@v3
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-1.3.13-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-bun-1.3.13-

    # Always run: the lockfile is frozen, so this resolves to the same tree
    # every time, and a warm download cache makes it cheap. Skipping it on a
    # cache hit is what allowed a partial tree to reach the test steps.
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Cache Playwright browsers
      if: inputs.playwright-browsers != ''
      uses: actions/cache@v3
      id: playwright_cache
      with:
        path: ~/.cache/ms-playwright
        key: >-
          ${{ runner.os }}-playwright-${{ inputs.playwright-browsers }}-${{
          hashFiles('bun.lock') }}

    # Always run, like `bun install` above and for the same reason. The cache
    # holds ~/.cache/ms-playwright, which is browser binaries; the system
    # libraries `--with-deps` installs live in /usr and are not in it. Skipping
    # this on a cache hit restored a WebKit that could not start, and the job
    # failed with "libevent-2.1.so.7: cannot open shared object file" — a
    # message that names a runner image, not anything in this repository.
    - name: Install Playwright system dependencies
      if: inputs.playwright-browsers != ''
      shell: bash
      working-directory: apps/web/frontend
      run: bunx playwright install-deps ${{ inputs.playwright-browsers }}

    - name: Install Playwright browsers
      if: >-
        inputs.playwright-browsers != '' &&
        steps.playwright_cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: apps/web/frontend
      run: bunx playwright install ${{ inputs.playwright-browsers }}
